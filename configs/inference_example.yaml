# Basic AttenGW inference example.

paths:
  # Directory with hdf noise and signal files which to evaluate (ideally, supplied by the downloader).
  input_dir: /path/to/evaluation/files

  # Base output directory.
  output_dir: /path/to/inference/output

  # Set exactly one of checkpoint_dir or checkpoint.
  checkpoint_dir: /path/to/train_job
  checkpoint:

  # Required only when asd_mismatch.enabled is true. Point to the folder containing training noise files
  training_noise_dir: /path/to/training/noise

inference:
  device: auto
  batch_size: 32
  stride: 4096
  offsets: [0, 1024, 2048, 3072]

triggers:

  thresholds: [0.999, 0.9995, 0.9999, 0.99999]

  merge_tolerance_s: 0.25

  smoothed_max:
    enabled: true
    smooth_samples: 64

  peak_width:
    enabled: true
    widths: [512, 992]

  full_peak:
    enabled: true
    widths: [512, 992]
    mean_margin: 0.05
    mean_cap: 0.95

classification:
  event_tolerance_s: 0.5

asd_mismatch:
  enabled: true
  k_nearest: 1
  welch_seconds: 8.0
  welch_overlap: 0.5
  smooth_bins: 9

sanity_checks:
  # Raw/unwhitened strain is always required. 
  strict: true
  check_sample_rate: true
  check_bandpass: true
